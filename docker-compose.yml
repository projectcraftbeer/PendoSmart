version: '3.8'
services:
  backend:
    build: ./backend
    env_file: 
      - ./backend/.env
    ports:
      - "8080:80"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend/
    env_file: 
      - ./frontend/.env
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
